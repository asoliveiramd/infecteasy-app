<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F4C5C" />
    <title>InfectEasy — Conexão indisponível</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F9F9; color: #17313A; }
      main { width: min(100% - 3rem, 34rem); box-sizing: border-box; border: 1px solid #DCE8E9; border-radius: 1.5rem; background: #fff; padding: 2.25rem; box-shadow: 0 18px 42px rgba(15, 76, 92, 0.11); }
      .mark { display: grid; width: 3rem; height: 3rem; place-items: center; border-radius: 1rem; background: #0F4C5C; color: #fff; font-size: 1.35rem; font-weight: 700; }
      p { color: #637E85; line-height: 1.6; }
      button { border: 0; border-radius: .75rem; background: #0F4C5C; color: #fff; padding: .8rem 1rem; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #79B9C0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">IE</div>
      <p style="font-size:.78rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#315A65">Acesso resiliente</p>
      <h1>Não foi possível abrir o InfectEasy agora</h1>
      <p>Verifique a conexão e tente novamente. Seus dados pessoais, respostas e progresso não são armazenados nesta tela nem serão enviados até que a conexão seja restabelecida.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
